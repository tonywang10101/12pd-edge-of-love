<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="atelierBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#231230"/>
      <stop offset="50%" stop-color="#431c52"/>
      <stop offset="100%" stop-color="#6b284e"/>
    </linearGradient>
    <radialGradient id="windowSun" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#f472b6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#231230" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#atelierBg)"/>
  <rect width="1920" height="1080" fill="url(#windowSun)"/>

